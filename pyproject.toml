[project]
name = "thesis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "cvxpylayers==0.1.9",
    "cvxpy>=1.6,<1.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.11.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
